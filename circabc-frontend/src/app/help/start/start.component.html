{{ 'label.help' | transloco | cbcSetTitle }} @if (loading) {
<cbc-horizontal-loader />
} @if (isAdminOrSupport()) {
<header class="actions">
  <!-- <a tabindex="0" (click)="showCreateLinkModal = true"
    >{{ 'help.add.link' | transloco }}</a
  >
  <a tabindex="0" class="cta" (click)="showCreateModal = true"
    >{{ 'help.add.section' | transloco }}</a
  > -->
  <div style="display: flex; margin-top: 10px; gap: 10px">
    <cbc-export-faq-button />
    <cbc-import-faq (importSuccess)="refreshCategories()" />
  </div>
</header>
}

<header class="help-header">
  <div class="help-header-container">
    <img src="img/help-message.png" alt="Help message" />
    <h1>{{ 'help.header.title' | transloco }}</h1>
  </div>
</header>

<section class="start-container" [class.article-open]="isArticleViewerOpen()">
  <section class="contact-section">
    <a [routerLink]="['/help/contact']"
      >{{ 'label.contact' | transloco }}
      <img src="img/email.png" alt="Email icon"
    /></a>
  </section>

  <section class="help-highlights">
    <cbc-faq-highlights></cbc-faq-highlights>
  </section>

  <div class="main-content-wrapper">
    <section
      class="help-categories"
      [class.compressed]="isArticleViewerOpen()"
      [style.width.%]="isArticleViewerOpen() ? categoriesWidth() : 100"
    >
      <h2>{{ 'help.faq' | transloco }}</h2>
      <app-help-accordion> </app-help-accordion>
    </section>

    @if (isArticleViewerOpen()) {
    <div
      class="resize-handle"
      (mousedown)="startResize($event)"
      (touchstart)="startResize($event)"
    >
      <div class="resize-handle-bar"></div>
    </div>
    }

    <section
      class="help-article-viewer"
      [class.visible]="isArticleViewerOpen()"
      [style.width]="isArticleViewerOpen() ? 'calc(' + articleWidth() + '% - 25px)' : '0'"
    >
      <app-article-viewer></app-article-viewer>
    </section>
  </div>

  <section class="help-links" [class.hidden]="isArticleViewerOpen()">
    <cbc-help-links
      [links]="links()"
      (linkDeleted)="refreshLinks()"
      (clickedForEdition)="openForEdit($event)"
    >
    </cbc-help-links>
  </section>
</section>

<cbc-add-link
  [(showModal)]="showCreateLinkModal"
  (linkCreated)="refreshLinks($event)"
  [(linkId)]="linkId"
/>
