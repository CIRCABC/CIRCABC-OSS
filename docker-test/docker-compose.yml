# CircaBC — Local Docker test environment
#
# Self-contained stack for evaluating CircaBC locally, including a mock
# EU Login (CAS/OAuth2) provider so the authentication flow can be exercised
# without access to the real EU Login service.
#
#   docker compose -f docker-test/docker-compose.yml up -d
#
# Services (names match what the backend image and the frontend
# proxy.conf.docker.json expect):
#   - circabc-rest-postgres  PostgreSQL database
#   - circabc-rest-ass       Alfresco Search Services (Solr)
#   - circabc-rest-acs       Alfresco Content Services + CircaBC REST API (:8080)
#   - frontend               Angular UI dev server (:4200)
#   - eulogin-mock           Mock EU Login / CAS provider (https://localhost:7002)
#
# NOTE: build the backend image first (it packages the Alfresco WAR):
#   cd backend && ./run.sh build_start
# then bring the environment up with this compose file.
name: circabc-test

services:
  circabc-rest-postgres:
    image: postgres:16.6
    environment:
      POSTGRES_DB: alfresco
      POSTGRES_USER: alfresco
      POSTGRES_PASSWORD: alfresco
    command: postgres -c max_connections=300 -c log_min_messages=LOG
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [circabc]

  circabc-rest-ass:
    image: alfresco/alfresco-search-services:2.0.18
    environment:
      SOLR_ALFRESCO_HOST: circabc-rest-acs
      SOLR_ALFRESCO_PORT: 8080
      SOLR_SOLR_HOST: circabc-rest-ass
      SOLR_SOLR_PORT: 8983
      SOLR_CREATE_ALFRESCO_DEFAULTS: alfresco,archive
      ALFRESCO_SECURE_COMMS: "secret"
      JAVA_TOOL_OPTIONS: "-Dalfresco.secureComms.secret=secret"
    ports:
      - "8983:8983"
    volumes:
      - solr-data:/opt/alfresco-search-services/data
    networks: [circabc]

  circabc-rest-acs:
    image: alfresco-content-services-circabc-rest:development
    # DB / Solr hosts are baked into the image's alfresco-global.properties and
    # resolve to the service names above. The keystore password placeholders
    # default to "changeit"; override via the environment for a custom keystore.
    environment:
      JAVA_TOOL_OPTIONS: "-Dencryption.keystore.type=JCEKS -Dencryption.cipherAlgorithm=AES/CBC/PKCS5Padding -Dencryption.keyAlgorithm=AES -Dencryption.keystore.location=/usr/local/tomcat/shared/classes/alfresco/extension/keystore/keystore -Dmetadata-keystore.password=${METADATA_KEYSTORE_PASSWORD:-changeit} -Dmetadata-keystore.aliases=metadata -Dmetadata-keystore.metadata.password=${METADATA_KEYSTORE_METADATA_PASSWORD:-changeit} -Dmetadata-keystore.metadata.algorithm=AES"
      JAVA_OPTS: "
        -Dsolr.secureComms=secret
        -Dsolr.sharedSecret=secret
        -Dcircabc.admin.password=${CIRCABC_ADMIN_PASSWORD:-admin}
        -Dcas.baseUrl=${CAS_BASE_URL:-https://ecas.ec.europa.eu/cas}
        -Dcas.serviceUrl=${CAS_SERVICE_URL:-http://localhost:8080/alfresco/service/circabc/eulogin}
        -Dcas.frontendRedirectUrl=${CAS_FRONTEND_REDIRECT_URL:-http://localhost:4200/ui/welcome}
        "
    ports:
      - "8080:8080"
    depends_on:
      - circabc-rest-postgres
      - circabc-rest-ass
    volumes:
      - acs-data:/usr/local/tomcat/alf_data
    networks: [circabc]

  frontend:
    build:
      context: ../frontend
      dockerfile: ./Dockerfile
    ports:
      - "4200:4200"
    depends_on:
      - circabc-rest-acs
    networks: [circabc]

  eulogin-mock:
    build:
      context: ./eulogin-mock
      dockerfile: ./Dockerfile
    ports:
      - "7002:7002"
    networks:
      circabc:
        aliases:
          - eulogin

volumes:
  db-data:
  solr-data:
  acs-data:

networks:
  circabc:
    driver: bridge
