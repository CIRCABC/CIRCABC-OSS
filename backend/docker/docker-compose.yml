version: '3.4'
services:
#  Optional
#  circabc-rest-share:
#    image: ${docker.share.image}:${alfresco.share.version}
#    environment:
#      REPO_HOST: circabc-rest-acs
#      REPO_PORT: 8080
#    ports:
#      - "${share.port}:8080"
  circabc-rest-acs:
    image: alfresco-content-services-circabc-rest:development
    build:
      dockerfile: ./Dockerfile
      context: ../../../target
    environment:
      JAVA_TOOL_OPTIONS: "${keystore.settings}"
      JAVA_OPTS: "
        -Dsolr.secureComms=secret
        -Dsolr.sharedSecret=secret
        -Dcircabc.admin.password=${CIRCABC_ADMIN_PASSWORD}
        "
      IMPORT_PASSWORD: "${IMPORT_PASSWORD}"
      CATALINA_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=0.0.0.0:8888"
      CAS_SERVICE_URL: "${CAS_SERVICE_URL}"
      CAS_FRONTEND_REDIRECT_URL: "${CAS_FRONTEND_REDIRECT_URL}"
    ports:
      - "${acs.port}:8080"
      - "${acs.debug.port}:8888"
    volumes:
      - circabc-rest-acs-volume:/usr/local/tomcat/alf_data
    depends_on:
      - circabc-rest-postgres
  circabc-rest-postgres:
    image: postgres:16.6
    environment:
      POSTGRES_DB: alfresco
      POSTGRES_USER: alfresco
      POSTGRES_PASSWORD: alfresco
    command: postgres -c max_connections=300 -c log_min_messages=LOG
    ports:
      - "${postgres.port}:5432"
    volumes:
      - circabc-rest-db-volume:/var/lib/postgresql/data
  circabc-rest-ass:
    image: alfresco/alfresco-search-services:2.0.18
    environment:
      SOLR_ALFRESCO_HOST: circabc-rest-acs
      SOLR_ALFRESCO_PORT: 8080
      SOLR_SOLR_HOST: circabc-rest-ass
      SOLR_SOLR_PORT: 8983
      SOLR_CREATE_ALFRESCO_DEFAULTS: alfresco,archive
      ALFRESCO_SECURE_COMMS: "secret"
      JAVA_TOOL_OPTIONS: "-Dalfresco.secureComms.secret=secret"
    ports:
      - "8983:8983"
    volumes:
      - circabc-rest-ass-volume:/opt/alfresco-search-services/contentstore
      - circabc-rest-ass-volume:/opt/alfresco-search-services/data
volumes:
  circabc-rest-acs-volume:
    external: true
  circabc-rest-db-volume:
    external: true
  circabc-rest-ass-volume:
    external: true
