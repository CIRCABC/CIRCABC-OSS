# RUN TIME PROPERTIES
# -------------------

# JavaMelody SQL monitoring: switched driver to proxy. Rollback: set db.driver=org.postgresql.Driver and remove '?driver=org.postgresql.Driver' from db.url

# Alfresco configuration for running locally with PostgreSQL Database
# Configuration when running Tomcat embedded from Maven.
# Property values from the POM but it can also be edited here.

# Alfresco Repo Webapp (alfresco.war) context, ports etc
alfresco.context=alfresco
alfresco.host=localhost
alfresco.port=8080
alfresco.protocol=http

# Alfresco Share Webapp (share.war) context, ports etc
share.context=share
share.host=localhost
share.port=8180
share.protocol=http

# Don't try and recover any index 
index.recovery.mode=NONE

# These jobs seem to require Lucene (Unsupported Operation with Solr) so we disable them / set to future date
# See https://forums.alfresco.com/en/viewtopic.php?f=52&t=41597
# If you want to enable them (and so full WQS functionality), please also set index.subsystem.name=lucene
wcmqs.dynamicCollectionProcessor.schedule=0 30 2 * * ? 2060
wcmqs.feedbackProcessor.schedule=0 40 2 * * ? 2060
wcmqs.publishQueueProcessor.schedule=0 50 2 * * ? 2060

# Fail or not when there are node integrity checker errors
integrity.failOnError=true

# Alfresco Repository PostgreSQL Database configuration.
# Original driver:
# db.driver=org.postgresql.Driver
# Replaced with JavaMelody proxy driver to capture SQL timings
 db.driver=net.bull.javamelody.JdbcDriver

# This Alfresco Platform Configuration file should be used for custom properties that are introduced by this module.
# Define default values for all properties here.
# System Administrators can override these values in environment specific configurations in
# alfresco/tomcat/shared/classes/alfresco-global.properties.
#
index.subsystem.name=solr6
solr.host=circabc-rest-ass
solr.port=8983
solr.secureComms=secret
solr.sharedSecret=secret

db.username=alfresco
db.password=alfresco
db.pool.initial=10
db.pool.max=100

# Original URL:
# db.url=jdbc:postgresql://circabc-rest-postgres:5432/alfresco
# JavaMelody proxy URL (adds real driver as query param; append with &driver=... if other params later)
db.url=jdbc:postgresql://circabc-rest-postgres:5432/alfresco?driver=org.postgresql.Driver

# File servers related properties
# For local runs we disable CIFS and FTP
cifs.enabled=false
ftp.enabled=false

csrf.filter.enabled=false

# Embedded broker without persistence
messaging.broker.url=vm://localhost?broker.persistent=false

# Disable messaging/events subsystems (not used by CIRCABC)
# messaging.subsystem.autoStart: prevents the JMS messaging subsystem from starting (no ActiveMQ connection attempts)
# events.subsystem.autoStart: prevents the event generation subsystem from starting (no event publishing)
# repo.event2.enabled: disables the v2 Repository Event model introduced in ACS 7+ (no events sent to topic)
messaging.subsystem.autoStart=false
events.subsystem.autoStart=false
repo.event2.enabled=false

# Disable ATS
transform.service.enabled=false
local.transform.service.enabled=false
legacy.transform.service.enabled=false

# Admin password enforcement on startup (leave empty to skip)
circabc.admin.password=

# Enable outbound email
mail.enabled=${MAIL_ENABLED:false}

# IG Import: credentials for downloading content from source CIRCABC instance
import.username=${IMPORT_USERNAME:admin}
import.password=${IMPORT_PASSWORD:}