#machine translation delivery parameters
mt.enabled=${MT_ENABLED:false}
mt.protocol=${MT_PROTOCOL:ftp}
mt.user=${MT_USER:user}
mt.password=${MT_PASSWORD}
mt.host=${MT_HOST:host}
mt.port=${MT_PORT:1021}
mt.root.space=${MT_ROOT_SPACE:MT}
mt.application.name=${MT_APPLICATION_NAME:circabc}
mt.service.url=${MT_SERVICE_URL:https://webgate.ec.europa.eu/mtatecservices/public-services/translationService.wsdl}
mt.callback.url=${MT_CALLBACK_URL:http://localhost:8080/alfresco}

mt.rest.url=${MT_REST_URL:https://webgate.ec.europa.eu/etranslation/si/translate}
mt.rest.username=${MT_REST_USERNAME:circabc}
mt.rest.password=${MT_REST_PASSWORD}
# ECAS
authentication.chain=${AUTHENTICATION_CHAIN:alfrescoNtlm1:alfrescoNtlm}

# EU Login (ECAS) CAS Configuration
cas.baseUrl=${CAS_BASE_URL:https://ecas.ec.europa.eu/cas}
cas.serviceUrl=${CAS_SERVICE_URL:http://localhost:8080/alfresco/service/circabc/eulogin}
cas.frontendRedirectUrl=${CAS_FRONTEND_REDIRECT_URL:http://localhost:4200/ui/welcome}
cas.cookiePath=${CAS_COOKIE_PATH:/}

# Host name for the PDF preview rendition system. 
# If this property is not set, the hostname will be used instead
document.preview.render.host=${DOCUMENT_PREVIEW_RENDER_HOST:localhost}

# Allowed sizes for files (post attachments / logos for category, IG, avatar, etc.)
posts.allowed.attachment.size.bytes=${POSTS_ALLOWED_ATTACHMENT_SIZE_BYTES:1048576}
logo.allowed.size.bytes=${LOGO_ALLOWED_SIZE_BYTES:1048576}

# Define the name of the root temporary folder
business.temp.folder.name=${BUSINESS_TEMP_FOLDER_NAME:tempfiles}

# Define the time (millisecond) that a file can stay in the temp directory before cleanup.
# Since they are not many temp files created, this can be huge.
# We have to ensure that the user not longer need to access to it.
# 24 hours
business.temp.time.before.deletion=${BUSINESS_TEMP_TIME_BEFORE_DELETION:86400000}

app.autoupload.enabled.on.hostname=${APP_AUTOUPLOAD_ENABLED_ON_HOSTNAME:}

max.user.number=${MAX_USER_NUMBER:5}

iam.location=${IAM_LOCATION:}
iam.login=${IAM_LOGIN:}
iam.password=${IAM_PASSWORD:}
iam.error.email=${IAM_ERROR_EMAIL:}

### Jobs
log.job.enabled=${LOG_JOB_ENABLED:true}
circabc.global.statistics.enabled=${CIRCABC_GLOBAL_STATISTICS_ENABLED:true}
circabc.global.statistics.cron.expression=${CIRCABC_GLOBAL_STATISTICS_CRON_EXPRESSION:0 5 0 * * ?}
circabc.global.statistics.enabled.on.hostname=${CIRCABC_GLOBAL_STATISTICS_ENABLED_ON_HOSTNAME:}
app.autoupload.enabled=${APP_AUTOUPLOAD_ENABLED:true}

revocation.job.enabled=${REVOCATION_JOB_ENABLED:true}
clean.permission.job.enabled=${CLEAN_PERMISSION_JOB_ENABLED:true}
distribution.list.sender.job.enabled=${DISTRIBUTION_LIST_SENDER_JOB_ENABLED:true}

# EMAIL Server Configuration for meeting responses
email_protocol=${EMAIL_PROTOCOL:pop3}
email_server=${EMAIL_SERVER:localhost}
email_server_port=${EMAIL_SERVER_PORT:110}
email_box=${EMAIL_BOX:INBOX}
email_username=${EMAIL_USERNAME:CIRCABC-LOCAL}
email_password=${EMAIL_PASSWORD:CIRCABC-LOCAL}
email_address=${EMAIL_ADDRESS:CIRCABC-LOCAL@ec.europa.eu}
is_email_listener_active=${IS_EMAIL_LISTENER_ACTIVE:false}
is_email_use_tls=${IS_EMAIL_USE_TLS:true}

# maximum lock time in hours for a job , after entry in cbc_lcok table will be deleted 
unlock.job.enabled=${UNLOCK_JOB_ENABLED:true}
max.job.lock.time.in.hours=${MAX_JOB_LOCK_TIME_IN_HOURS:12}
# member exiration
member.expiration.job.enabled=${MEMBER_EXPIRATION_JOB_ENABLED:true}

