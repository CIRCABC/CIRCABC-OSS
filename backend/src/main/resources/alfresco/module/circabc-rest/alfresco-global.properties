## This Alfresco Platform Configuration file should be used for custom properties that are introduced by this module.
## Define default values for all properties here.
## System Administrators can override these values in environment specific configurations in
## alfresco/tomcat/shared/classes/alfresco-global.properties.
## 
build.circabc.app.name=CIRCABC
# ent, oss or olaf
build.circabc.release=${BUILD_CIRCABC_RELEASE:oss}
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# for mysql mariadb use org.hibernate.dialect.MySQLDialect
# for oracle use org.hibernate.dialect.Oracle10gDialect

new.ui.url=${NEW_UI_URL:http://localhost:4200}
new.ui.context=${NEW_UI_CONTEXT:/ui/}

# Configuration parameter to use direct store access to Events instead of the search subsystem.
# It was added to avoid the delay that SOLR's eventual consistency caused.
# If set to false, is uses the original Lucene/SOLR search.
events.direct.store.access=${EVENTS_DIRECT_STORE_ACCESS:true}

email_address=
is_email_listener_active=${IS_EMAIL_LISTENER_ACTIVE:true}

#-------------------------#
# Email configuration     #
#-------------------------#
mail.enabled=${MAIL_ENABLED:false}
mail.host=${MAIL_HOST:maildev}
# Mail server configuration for sending
mail.protocol=${MAIL_PROTOCOL:smtp}
mail.port=${MAIL_PORT:1025}
mail.encoding=${MAIL_ENCODING:UTF-8}
mail.username=${MAIL_USERNAME:CIRCABC-LOCAL}
mail.password=${MAIL_PASSWORD:CIRCABC-LOCAL}
mail.from.default=${MAIL_FROM_DEFAULT:CIRCABC-LOCAL@localhost.test}
mail.smtp.debug=${MAIL_SMTP_DEBUG:true}
mail.redirect.email.address.enabled=${MAIL_REDIRECT_EMAIL_ADDRESS_ENABLED:false}
web.root.url=${WEB_ROOT_URL:http://localhost:8080/alfresco}
mail.disclamer.environment.consideration=${MAIL_DISCLAMER_ENVIRONMENT_CONSIDERATION:Please consider the environment before deciding to print this e-mail.}
mail.disclamer.content.support=This e-mail has been sent by the {2} application. If you have any question, feel free to use the <i>contact form</i> of {2}.
mail.disclamer.content.core=This e-mail and any attachments thereto may contain information which is confidential and/or protected by intellectual property \
rights and are intended for the sole use of the recipient(s) named above. Any use of the information contained herein (including, \
but not limited to, total or partial reproduction, communication or distribution in any form) by persons other than the designated \
recipient(s) is prohibited.
mail.disclamer.content.thanks=${MAIL_DISCLAMER_CONTENT_THANKS:Thank you for your cooperation.}

mail.disclamer.logo.cid=${MAIL_DISCLAMER_LOGO_CID:circabcLogo}
mail.disclamer.text="\n=======================================================\n${mail.disclamer.environment.consideration}\n\n${mail.disclamer.content.support}\n\n${mail.disclamer.content.core}\n${mail.disclamer.content.thanks}\n\n{1}";
mail.disclamer.html=<br /><hr /><b><i><span lang=\"EN\" style=\"font-size: 10pt; font-family: Georgia; color: green;\">${mail.disclamer.environment.consideration}</span></i></b><br /><br /><img align=\"left\" alt=\"CIRCABC logo\" src='cid:${mail.disclamer.logo.cid}' />${mail.disclamer.content.support}<br /><br />${mail.disclamer.content.core}<br />${mail.disclamer.content.thanks}<br /><br /><a title="CIRCABC home page" href=\"{1}\">{1}</a>

# Environment name to be added to the subject and body of emails being sent
# With this setting the users can know from which system the email came from
mail.environment.name.enabled=${MAIL_ENVIRONMENT_NAME_ENABLED:true}
mail.environment.name=${MAIL_ENVIRONMENT_NAME:CIRCABC LOCAL}

