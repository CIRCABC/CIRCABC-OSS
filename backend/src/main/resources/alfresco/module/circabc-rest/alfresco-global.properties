proxy.enable=${PROXY_ENABLE:false}
proxy.url=${PROXY_URL:}
proxy.port=${PROXY_PORT:0}
proxy.username=${PROXY_USERNAME:}
proxy.password=${PROXY_PASSWORD:}

# EU captcha default URL
