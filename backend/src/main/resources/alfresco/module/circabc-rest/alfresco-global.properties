service.now.password=${SERVICE_NOW_PASSWORD:TO_BE_REPLACED_WITH_RIGHT_PASSWORD}

assignment_group=${SERVICE_NOW_ASSIGNMENT_GROUP:DIGIT CIRCABC Support}
business_service=${SERVICE_NOW_BUSINESS_SERVICE:CIRCABC service}
