        - basicAuth: []
      tags:
        - ExternalRepository
      description: Save an external repository transaction.
      parameters:
        - in: path
          name: id
          required: true
          description: Repository ID
          schema:
            type: string
      responses:
        '200':
          description: Transaction saved
        '403':
          description: Access denied
      requestBody:
        $ref: '#/components/requestBodies/ExternalRepoTransaction'
  /ig/{id}/export:
    post:
      operationId: igExport
      security:
        - basicAuth: []
      tags:
        - InterestGroup
      description: Export an Interest Group to XML (ImportRoot JAXB format). Admin only.
      parameters:
        - in: path
          name: id
          required: true
          description: The node ID of the Interest Group to export
          schema:
            type: string
      responses:
        '200':
          description: XML export of the Interest Group
          content:
            application/xml:
              schema:
                type: string
        '403':
          description: Access denied — requires Alfresco administrator role
        '404':
          description: Interest Group not found
        '500':
          description: Export failed
  /ig/{categoryId}/import:
    post:
      operationId: igImport
      security:
        - basicAuth: []
      tags:
        - InterestGroup
      description: Import an Interest Group from XML (ImportRoot JAXB format) into a category. Admin only. Accepts multipart form with XML file.
      parameters:
        - in: path
          name: categoryId
          required: true
          description: The node ID of the category to import the Interest Group into
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: XML file containing the ImportRoot structure
              required:
                - file
      responses:
        '200':
          description: Import completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IgImportResponse'
        '400':
          description: Bad request — no XML file uploaded
        '403':
          description: Access denied — requires Alfresco administrator role
        '500':
          description: Import failed
tags:
  - name: Header
    description: CIRCABC header management (top-level organizational containers for categories)
  - name: Category
    description: category management (organizational containers for Interest Groups)
  - name: InterestGroup
    description: Interest Group CRUD, configuration, logos, and deletion workflows
  - name: User
    description: user account management, avatars, preferences, and memberships
  - name: Content
    description: document content operations (versioning, checkout/checkin, translations)
  - name: Information
    description: Information service pages and news items within Interest Groups
  - name: Events
    description: calendar events and meetings within Interest Groups
  - name: Members
    description: Interest Group membership management (invite, update, remove, export)
  - name: Search
    description: search operations within Interest Groups or across the whole application
  - name: Profile
    description: access profile definitions within Interest Groups
  - name: Keywords
    description: keyword management for content classification within Interest Groups
  - name: DynamicProperties
    description: dynamic property definitions for custom metadata within Interest Groups
  - name: Notification
    description: notification configuration and subscription management
  - name: Space
    description: folder/space operations (create, share, upload, import)
  - name: Permission
    description: node-level permission management within Interest Groups
  - name: Translations
    description: multilingual content translation management
  - name: Audit
    description: audit and activity logging for Interest Groups and the application
  - name: Forum
    description: forum management within the Newsgroup service
  - name: Topic
    description: topic management within forums
  - name: Post
    description: post and reply management within topics
  - name: Dashboard
    description: user and Interest Group dashboard data (news feed, recent uploads/downloads)
  - name: Help
    description: help categories, articles, and links management
  - name: File
    description: file transfer and upload operations
  - name: ExternalRepository
    description: external repository (ARES) integration and document registration
  - name: Info
    description: application instance information
  - name: AppMessage
    description: application-wide messages and distribution mail management
  - name: Archive
    description: operations related to archived (deleted) content recovery
  - name: AutoUpload
    description: automated FTP-based content upload configuration and management
  - name: Circabc
    description: CIRCABC application-level administration (admin users, settings)
  - name: Email
    description: email sending operations within Interest Groups
  - name: Expired
    description: management of expired documents within Interest Groups
  - name: FTP
    description: FTP connection testing for auto-upload configurations
  - name: Favourites
    description: user favourite Interest Groups management
  - name: Guards
    description: permission guard checks for UI visibility (access, admin, edition rights)
  - name: History
    description: membership history, recovery, and revocation operations
  - name: Login
    description: user authentication and login operations
  - name: Nodes
    description: generic node operations (info, path, group lookup, clipboard)
components:
  requestBodies:
    ExternalRepoTransaction:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExternalRepoTransaction'
      required: true
    KeywordDefinition:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/KeywordDefinition'
      required: true
    ApplicantAction:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApplicantAction'
      required: true
    HelpLink:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HelpLink'
      required: true
    Node:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Node'
      required: true
    News:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/News'
      required: true
    DynamicPropertyDefinition:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DynamicPropertyDefinition'
      required: true
    Profile:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Profile'
      required: true
    EventDefinition:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EventDefinition'
      required: true
    HelpArticle:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HelpArticle'
      required: true
    Header:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Header'
      required: true
    Category:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Category'
      required: true
    MembershipPostDefinition:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MembershipPostDefinition'
      required: true
    EmailDefinition:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmailDefinition'
    contactLeadersByEmailBody:
      content:
        application/json:
          schema:
            type: string
      required: true
    AppMessage:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AppMessage'
      required: true
    setDisplayOldMessageBody:
      content:
        application/json:
          schema:
            type: boolean
      required: true
    HelpCategory:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HelpCategory'
      required: true
    TicketRequestInfo:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TicketRequestInfo'
  securitySchemes:
    basicAuth:
      type: http
      description: HTTP Basic Authentication
      scheme: basic
  schemas:
    IgImportResponse:
      type: object
      properties:
        message:
          type: string
        nodesCreated:
          type: integer
        errors:
          type: integer
    TicketRequestInfo:
      type: object
      required:
        - requestDate
        - httpVerb
        - path
      properties:
        requestDate:
          type: string
          description: request date
          example: Thu, 20 Apr 2017 11:16:08 GMT
        httpVerb:
          type: string
          description: HTTP verb of service that we want to call
          example: GET or POST
        path:
          type: string
          description: path of service that we want to call
          example: /Ares/bridge/services/v1/document
    Header:
      type: object
      description: Representation of a header in CIRCABC in a JSON object
      required:
        - name
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        description:
          $ref: '#/components/schemas/i18nProperty'
    Category:
      type: object
      description: Representation of a Category in CIRCABC in a JSON object
      required:
        - name
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        title:
          $ref: '#/components/schemas/i18nProperty'
        logoRef:
          type: string
        useSingleContact:
          type: boolean
        contactEmails:
          type: array
          items:
            type: string
        contactVerified:
          type: boolean
    InterestGroup:
      type: object
      description: Representation of an Interest group in CIRCABC in a JSON object
      required:
        - name
        - permissions
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        title:
          $ref: '#/components/schemas/i18nProperty'
        description:
          $ref: '#/components/schemas/i18nProperty'
        contact:
          $ref: '#/components/schemas/i18nProperty'
        libraryId:
          type: string
        informationId:
          type: string
        newsgroupId:
          type: string
        eventId:
          type: string
        isPublic:
          type: boolean
        isRegistered:
          type: boolean
        allowApply:
          type: boolean
        permissions:
          type: object
          additionalProperties:
            type: string
          description: |
            Representation of the permissions given to the user making the call.
            To know what are the permissions for each services inside one group.
        logoUrl:
          type: string
    InterestGroupPostModel:
      type: object
      description: The object of an Interest group in CIRCABC to be created
      required:
        - name
      properties:
        name:
          type: string
        title:
          $ref: '#/components/schemas/i18nProperty'
        description:
          $ref: '#/components/schemas/i18nProperty'
        contact:
          $ref: '#/components/schemas/i18nProperty'
        leaders:
          type: array
          items:
            type: string
        notify:
          type: boolean
        notifyText:
          $ref: '#/components/schemas/i18nProperty'
    GroupConfigurationNewsgroups:
      type: object
      required:
        - enableFlagNewTopic
        - enableFlagNewForum
        - ageFlagNewTopic
        - ageFlagNewForum
      properties:
        enableFlagNewTopic:
          type: boolean
        enableFlagNewForum:
          type: boolean
        ageFlagNewTopic:
          type: integer
        ageFlagNewForum:
          type: integer
    GroupConfiguration:
      type: object
      description: |
        JSON object that contains all the configuration variables of an Interest Group
      required:
        - newsgroups
      properties:
        information:
          type: object
          additionalProperties:
            type: string
        library:
          type: object
          additionalProperties:
            type: string
        newsgroups:
          $ref: '#/components/schemas/GroupConfigurationNewsgroups'
        events:
          type: object
          additionalProperties:
            type: string
        dashboard:
          type: object
          additionalProperties:
            type: string
    Attachment:
      type: object
      description: a post attachment
      properties:
        name:
          type: string
        title:
          type: string
        id:
          type: string
        attachedToId:
          type: string
        size:
          type: integer
        encoding:
          type: string
        mimetype:
          type: string
        isLink:
          type: boolean
    AttachmentsRemainingSize:
      type: object
      required:
        - remainingSize
      properties:
        remainingSize:
          type: integer
    Node:
      type: object
      description: representation of a node
      properties:
        id:
          type: string
        type:
          type: string
        service:
          type: string
          enum:
            - library
            - information
            - events
            - newsgroups
            - directory
        name:
          type: string
        title:
          $ref: '#/components/schemas/i18nProperty'
        description:
          $ref: '#/components/schemas/i18nProperty'
        properties:
          type: object
          additionalProperties:
            type: string
        permissions:
          type: object
          additionalProperties:
            type: string
          description: |
            Representation of the permissions given to the user making the call.
            To know what are the permissions for the specific node, the permission
            definition may vary depending on its type or service.
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        parentId:
          type: string
        notifications:
          type: string
        favourite:
          type: boolean
          description: |
            true if the current user faved the node
        hasSubFolders:
          type: boolean
        hasGuestAccess:
          type: boolean
        originalNodeRef:
          type: string
          description: >
            For nodes created by the CIRCABC migration/import process, the NodeRef
            of the original (source) node they were migrated from (stored via the
            ci:migrated aspect). Absent for non-migrated nodes.
    OriginalNodeRef:
      type: object
