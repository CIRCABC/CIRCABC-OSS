openapi: 3.0.3
info:
  version: 5.0.0.0
  title: CIRCABC REST API
  description: |
    This is the first version of the CIRCABC REST API used by the new User Interface
  contact:
    name: API Support
    email: DIGIT-CIRCABC-SUPPORT@ec.europa.eu
    url: https://circabc.europa.eu/ui/help/contact
  license:
    name: EUPL-1.1
servers:
  - url: ../service/circabc
    description: Default server
security:
  - basicAuth: []
paths:
  /admins:
    get:
      operationId: getCircabAdministrators
      security:
        - basicAuth: []
      tags:
        - Circabc
      description: Get all CIRCABC administrators. Requires CIRCABC administrator or Alfresco administrator role.
      parameters:
        - name: language
          in: query
          required: false
          description: Locale code to return translated properties in a specific language. If omitted, returns multilingual-aware values.
          schema:
            type: string
      responses:
        '200':
          description: List of CIRCABC administrators
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '400':
          description: Bad request — invalid node reference
        '403':
          description: Access denied — requires CIRCABC or Alfresco administrator role
      x-is-get: true
    post:
      operationId: postCircabcAdministrators
      security:
        - basicAuth: []
      tags:
        - Circabc
      description: Add one or more users as CIRCABC administrators. Requires CIRCABC administrator or Alfresco administrator role.
      parameters:
        - name: language
          in: query
          required: false
          description: Locale code for multilingual property handling.
          schema:
            type: string
      responses:
        '200':
          description: Users added as administrators
        '400':
          description: Bad request — invalid input or node reference
        '403':
          description: Access denied — requires CIRCABC or Alfresco administrator role
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
              description: List of user IDs to add as CIRCABC administrators
        required: true
  /admins/{userId}:
    delete:
      operationId: deleteCircabcAdministrators
      security:
        - basicAuth: []
      tags:
        - Circabc
      description: Remove a user from the CIRCABC administrator group. Requires CIRCABC administrator or Alfresco administrator role.
      parameters:
        - name: userId
          in: path
          required: true
          description: The user ID of the administrator to remove
          schema:
            type: string
      responses:
        '200':
          description: User removed from administrators
        '403':
          description: Access denied — requires CIRCABC or Alfresco administrator role
  /headers:
    get:
      operationId: getHeaders
      security: []
      tags:
        - Header
      description: Get all headers in the application. Supports guest access — no authentication required.
      parameters:
        - name: language
          in: query
          description: Two-letter language code (e.g. en, fr, de) to return translated properties in a specific language. If omitted, returns multilingual-aware values.
          required: false
          schema:
            type: string
        - name: guest
          in: query
          description: If true, filters results for guest visibility.
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: List of all headers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Header'
        '403':
          description: Access denied
      x-is-get: true
    post:
      operationId: postHeader
      security:
        - basicAuth: []
      tags:
        - Header
      description: Create a new header. Requires CIRCABC administrator or Alfresco administrator role.
      responses:
        '200':
          description: Header created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Header'
        '400':
          description: Bad request — missing or invalid name/description
        '403':
          description: Access denied — requires CIRCABC or Alfresco administrator role
        '409':
          description: Conflict — a header with the same name already exists
      requestBody:
        $ref: '#/components/requestBodies/Header'
  /headers/{id}:
    get:
      operationId: getHeader
      security: []
      tags:
        - Header
      description: Get a single header by ID. Supports guest access — no authentication required.
      parameters:
        - name: id
          in: path
          required: true
          description: Alfresco node ID of the header
          schema:
            type: string
        - name: language
          in: query
          required: false
          description: Two-letter language code to return translated properties.
          schema:
            type: string
      responses:
        '200':
          description: Header details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Header'
        '400':
          description: Bad request — invalid node reference
        '403':
          description: Access denied
      x-is-get: true
    delete:
      operationId: deleteHeader
      security:
        - basicAuth: []
      tags:
        - Header
      description: Delete a header by ID. The header must be empty (no categories). Requires CIRCABC administrator or Alfresco administrator role.
      parameters:
        - name: id
          in: path
          required: true
          description: Alfresco node ID of the header to delete
          schema:
            type: string
      responses:
        '200':
          description: Header deleted
        '400':
          description: Bad request — header is not empty or invalid node reference
        '403':
          description: Access denied — requires CIRCABC or Alfresco administrator role
    put:
      operationId: putHeader
      security:
        - basicAuth: []
      tags:
        - Header
      description: Update an existing header. Requires CIRCABC administrator or Alfresco administrator role.
      parameters:
        - name: id
          in: path
          required: true
          description: Alfresco node ID of the header to update
          schema:
            type: string
      responses:
        '200':
          description: Header updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Header'
        '400':
          description: Bad request — missing or invalid name/description
        '403':
          description: Access denied — requires CIRCABC or Alfresco administrator role
        '409':
          description: Conflict — a header with the same name already exists
      requestBody:
        $ref: '#/components/requestBodies/Header'
  /headers/{id}/categories:
    get:
      operationId: getCategoriesByHeaderId
      security: []
      tags:
        - Header
      description: List all categories belonging to a header. Supports guest access — no authentication required.
      parameters:
        - name: id
          in: path
          required: true
          description: Alfresco node ID of the header
          schema:
            type: string
        - name: language
          in: query
          required: false
          description: Two-letter language code to return translated properties.
          schema:
            type: string
        - name: guest
          in: query
          description: If true, filters results for guest visibility.
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: List of categories under this header
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
      x-is-get: true
    post:
      operationId: postCategory
      security:
        - basicAuth: []
      tags:
        - Category
      description: creates a new category
      parameters:
        - name: id
          description: header id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '403':
          description: Unauthorized
      requestBody:
        $ref: '#/components/requestBodies/Category'
  /categories:
    get:
      operationId: getAllCategorories
      security: []
      tags:
        - Category
      description: Get all categories across all headers. Supports guest access — no authentication required.
      parameters:
        - name: language
          in: query
          required: false
          description: Two-letter language code to return translated properties.
          schema:
            type: string
        - name: guest
          in: query
          description: If true, filters results for guest visibility.
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: List of all categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
      x-is-get: true
  /categories/{id}:
    get:
      operationId: getCategory
      security: []
      tags:
        - Category
      description: Get a single category by ID. Supports guest access — no authentication required.
      parameters:
        - name: id
          in: path
          required: true
          description: Alfresco node ID of the category
          schema:
            type: string
        - name: language
          in: query
          required: false
          description: Two-letter language code to return translated properties.
          schema:
            type: string
      responses:
        '200':
          description: Category details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Bad request — invalid node reference
        '403':
          description: Access denied
      x-is-get: true
    delete:
      operationId: deleteCategory
      security:
        - basicAuth: []
      tags:
        - Category
      description: Delete a category. Requires appropriate administrator permissions.
      parameters:
        - name: id
          in: path
          required: true
          description: Alfresco node ID of the category to delete
          schema:
            type: string
      responses:
        '200':
          description: Category deleted
        '403':
          description: Access denied — insufficient permissions
    put:
      operationId: putCategory
      security:
        - basicAuth: []
      tags:
        - Category
      description: Update an existing category (name, title). Requires category administrator role.
      parameters:
        - name: id
          in: path
          required: true
          description: Alfresco node ID of the category to update
          schema:
            type: string
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Bad request — invalid body or node reference
        '403':
          description: Access denied — requires category administrator role
      requestBody:
        $ref: '#/components/requestBodies/Category'
  /categories/{id}/logos:
    get:
      operationId: getCategoryLogoByCategoryId
      security:
        - basicAuth: []
      tags:
        - Category
      description: Get the list of logos uploaded for a category. Requires category administrator role.
      parameters:
        - name: id
          in: path
          required: true
          description: Alfresco node ID of the category
          schema:
            type: string
      responses:
        '200':
          description: List of logo nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Node'
        '400':
          description: Bad request — invalid node reference
        '403':
          description: Access denied — requires category administrator role
      x-is-get: true
    post:
      operationId: postCategoryLogoByCategoryId
      security:
        - basicAuth: []
      tags:
        - Category
      description: Upload a new logo for a category. Requires category administrator role.
      parameters:
        - name: id
          in: path
          required: true
          description: Alfresco node ID of the category
          schema:
            type: string
      responses:
        '200':
          description: Updated list of logo nodes after upload
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Node'
        '400':
          description: Bad request — invalid node reference
        '403':
          description: Access denied — requires category administrator role
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileData'
  /categories/{id}/logos/{logoId}:
    put:
      operationId: selectCategoryLogoByLogoId
      security:
        - basicAuth: []
      tags:
        - Category
      description: Select a logo as the active logo displayed in the UI for this category. Requires category administrator role.
      parameters:
        - name: id
          in: path
          required: true
          description: Alfresco node ID of the category
          schema:
            type: string
        - name: logoId
          in: path
          required: true
          description: Alfresco node ID of the logo to select
          schema:
            type: string
      responses:
        '200':
          description: Logo selected
        '400':
          description: Bad request — invalid node reference
        '403':
          description: Access denied — requires category administrator role
    delete:
      operationId: deleteCategoryLogoByLogoId
      security:
        - basicAuth: []
      tags:
        - Category
      description: Delete a logo from the category. If the logo is currently selected, the selection is cleared. Requires category administrator role.
      parameters:
        - name: id
          in: path
          required: true
          description: Alfresco node ID of the category
          schema:
            type: string
        - name: logoId
          in: path
          required: true
          description: Alfresco node ID of the logo to delete
          schema:
            type: string
      responses:
        '200':
          description: Updated list of logo nodes after deletion
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Node'
        '400':
          description: Bad request — invalid node reference
        '403':
          description: Access denied — requires category administrator role
  /categories/{id}/groups:
    get:
      operationId: getInterestGroupsByCategoryId
      security: []
      tags:
        - Category
      description: Get Interest Groups belonging to a category. For Alfresco admin users, returns all Interest Groups in the category. For authenticated regular users, returns only the groups they are a member of. For guest (unauthenticated) users, returns only public groups.
      parameters:
        - name: id
          in: path
          required: true
          description: Alfresco node ID of the category
          schema:
            type: string
        - name: language
          in: query
          required: false
          description: Two-letter language code to return translated properties.
          schema:
            type: string
        - name: guest
          in: query
          description: If true, filters results for guest visibility.
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: List of Interest Groups in this category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InterestGroup'
        '400':
          description: Bad request — invalid node reference
        '403':
          description: Access denied
      x-is-get: true
    post:
      operationId: postInterestGroup
      security:
        - basicAuth: []
      tags:
        - Category
      description: Create a new Interest Group in the category. Requires category administrator role.
      parameters:
        - name: id
          in: path
          required: true
          description: Alfresco node ID of the category
          schema:
            type: string
      responses:
        '200':
          description: Interest Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestGroup'
        '400':
          description: Bad request — invalid input or node reference
        '403':
          description: Access denied — requires category administrator role
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterestGroupPostModel'
  /categories/{id}/admins:
    get:
      operationId: getCategoryAdministrators
      security:
        - basicAuth: []
      tags:
        - Category
      description: Get the list of category administrators. Requires CIRCABC administrator or category administrator role.
      parameters:
        - name: id
          in: path
          required: true
          description: Alfresco node ID of the category
          schema:
            type: string
      responses:
        '200':
          description: List of category administrators
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '400':
          description: Bad request — invalid node reference
        '403':
          description: Access denied — requires CIRCABC or category administrator role
      x-is-get: true
    post:
      operationId: postCategoryAdministartors
      security:
        - basicAuth: []
      tags:
        - Category
      description: Add users as category administrators. Requires CIRCABC administrator or category administrator role.
      parameters:
        - name: id
          in: path
          required: true
          description: Alfresco node ID of the category
          schema:
            type: string
      responses:
        '200':
          description: Users added as category administrators
        '400':
          description: Bad request — invalid input or node reference
        '403':
          description: Access denied — requires CIRCABC or category administrator role
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
              description: List of user IDs to add as category administrators
        required: true
  /categories/{id}/admins/{userId}:
    delete:
      operationId: deleteCategoryAdministartor
      security:
        - basicAuth: []
      tags:
        - Category
      description: Remove a user from category administrators. Requires CIRCABC administrator or category administrator role.
      parameters:
        - name: id
          in: path
          required: true
          description: Alfresco node ID of the category
          schema:
            type: string
        - name: userId
          in: path
          required: true
          description: User ID of the administrator to remove
          schema:
            type: string
      responses:
        '200':
          description: User removed from category administrators
        '403':
          description: Access denied — requires CIRCABC or category administrator role
  /categories/{id}/requests/group:
    get:
      operationId: getInterestGroupRequests
      security:
        - basicAuth: []
      tags:
        - Category
      description: List Interest Group creation requests for a category. Requires category administrator role.
      parameters:
        - name: id
          required: true
          in: path
          description: Alfresco node ID of the category
          schema:
            type: string
        - name: limit
          in: query
          description: Number of results per page (25, 50, 100, or 0 for all).
          required: false
          schema:
            type: integer
            default: 25
        - name: page
          in: query
          description: Page number (1-based).
          required: false
          schema:
            type: integer
            default: 1
        - name: filter
          in: query
          description: Filter by approval status.
          required: false
          schema:
            type: string
            enum:
              - waiting
              - approved
              - rejected
      responses:
        '200':
          description: Paginated list of group creation requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedGroupCreationRequests'
        '403':
          description: Access denied — requires category administrator role
      x-is-get: true
    post:
      operationId: postRequestInterestGroup
      security:
        - basicAuth: []
      tags:
        - Category
      description: Submit a request to create a new Interest Group in this category.
      parameters:
        - name: id
          required: true
          in: path
          description: Alfresco node ID of the category
          schema:
            type: string
      responses:
        '200':
          description: Request submitted
        '400':
          description: Bad request — invalid input
        '403':
          description: Access denied
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreationRequest'
        required: true
  /categories/{id}/requests/group/{idRequest}:
    get:
      operationId: getInterestGroupRequest
      security:
        - basicAuth: []
      tags:
        - Category
      description: Get a single Interest Group creation request by ID. Requires category administrator role.
      parameters:
        - name: id
          required: true
          in: path
          description: Alfresco node ID of the category
          schema:
            type: string
        - name: idRequest
          required: true
          in: path
          description: ID of the group creation request
          schema:
            type: integer
      responses:
        '200':
          description: The group creation request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupCreationRequest'
        '403':
          description: Access denied — requires category administrator role
      x-is-get: true
    put:
      operationId: editInterestGroupRequest
      security:
        - basicAuth: []
      tags:
        - Category
      description: Edit an Interest Group creation request. Requires category administrator role.
      parameters:
        - name: id
          required: true
          in: path
          description: Alfresco node ID of the category
          schema:
            type: string
        - name: idRequest
          required: true
          in: path
          description: ID of the group creation request
          schema:
            type: integer
      responses:
        '200':
          description: Request updated
        '400':
          description: Bad request — invalid input
        '403':
          description: Access denied — requires category administrator role
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreationRequest'
        required: true
  /categories/{id}/requests/group/{idRequest}/approval:
    post:
      operationId: validateInterestGroupRequests
      security:
        - basicAuth: []
      tags:
        - Category
      description: Approve or reject an Interest Group creation request. Requires category administrator role.
      parameters:
        - name: id
          required: true
          in: path
          description: Alfresco node ID of the category
          schema:
            type: string
        - name: idRequest
          required: true
          in: path
          description: ID of the group creation request
          schema:
            type: integer
      responses:
        '200':
          description: Approval decision recorded
        '400':
          description: Bad request — invalid input
        '403':
          description: Access denied — requires category administrator role
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreationRequestApproval'
        required: true
  /categories/{id}/contact:
    post:
      operationId: contactCategoryAdmins
      security:
        - basicAuth: []
      tags:
        - Category
      description: Send an email to the category administrators. Not available to guest users.
      parameters:
        - name: id
          required: true
          in: path
          description: Alfresco node ID of the category
          schema:
            type: string
      responses:
        '200':
          description: Email sent
        '400':
          description: Bad request — invalid input
        '403':
          description: Access denied — not available to guest users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminContactRequest'
        required: true
  /categories/{id}/exported/profiles:
    get:
      operationId: getExportedProfiles
      security:
        - basicAuth: []
      tags:
        - Category
      description: Get the list of exported profiles from Interest Groups in this category.
      parameters:
        - name: id
          in: path
          required: true
          description: Alfresco node ID of the category
          schema:
            type: string
        - name: ignoreIgId
          in: query
          required: false
          description: Alfresco node ID of an Interest Group to exclude from results.
          schema:
            type: string
      responses:
        '200':
          description: List of exported profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Profile'
        '400':
          description: Bad request — invalid node reference
        '403':
          description: Access denied
      x-is-get: true
  /categories/{id}/statistics:
    get:
      operationId: getCategoryStatistics
      security:
        - basicAuth: []
      tags:
        - Category
      description: Get calculated Interest Group statistics for a category. Requires CIRCABC administrator or category administrator role.
      parameters:
        - name: id
          in: path
          required: true
          description: Alfresco node ID of the category
          schema:
            type: string
        - name: limit
          in: query
          description: Number of results per page (25, 50, 100, or 0 for all).
          required: false
          schema:
            type: integer
            default: 25
        - name: page
          in: query
          description: Page number (1-based).
          required: false
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Paginated IG statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedStatisticsContents'
        '400':
          description: Bad request — invalid node reference
        '403':
          description: Access denied — requires CIRCABC or category administrator role
      x-is-get: true
    post:
      operationId: postCategoryStatistics
      security:
        - basicAuth: []
      tags:
        - Category
      description: Trigger calculation of current Interest Group statistics for a category. Requires category administrator role.
      parameters:
        - name: id
          in: path
          required: true
          description: Alfresco node ID of the category
          schema:
            type: string
      responses:
        '200':
          description: Statistics calculation triggered
        '400':
          description: Bad request — invalid node reference
        '403':
          description: Access denied — requires category administrator role
  /ftp/connection:
    get:
      operationId: testFTPConnectionOnServer
      security:
        - basicAuth: []
      tags:
        - FTP
      description: Test an FTP connection with the given parameters.
      parameters:
        - name: host
          in: query
          required: true
          description: FTP host
          schema:
            type: string
        - name: port
          in: query
          required: true
          description: FTP port
          schema:
            type: integer
        - name: username
          in: query
          required: true
          description: FTP username
          schema:
            type: string
        - name: password
          in: query
          required: true
          description: FTP password
          schema:
            type: string
        - name: filePath
          in: query
          required: true
          description: Remote file path to test
          schema:
            type: string
      responses:
        '200':
          description: Connection test result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '403':
          description: Access denied
      x-is-get: true
  /groups/visited:
    get:
      operationId: getVisitedInterestGroups
      security:
