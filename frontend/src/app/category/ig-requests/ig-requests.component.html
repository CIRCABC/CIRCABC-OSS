<mat-tab-group
  mat-stretch-tabs="false"
  mat-align-tabs="start"
  animationDuration="0ms"
>
  <mat-tab [label]="'label.request.create' | transloco ">
    <cbc-group-requests-create />
  </mat-tab>
  <mat-tab [label]="'label.request.delete' | transloco ">
    <ng-template mat-tab-label>
      <span data-cy="tab-delete-requests"
        >{{ 'label.request.delete' | transloco }}</span
      >
    </ng-template>
    <cbc-group-requests-delete />
  </mat-tab>
</mat-tab-group>
