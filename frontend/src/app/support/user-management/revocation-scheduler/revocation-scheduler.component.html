<cbc-modal
  [title]="'memberships.revocation.user.modal.title' | transloco"
  [visible]="showModal()"
  (cancelModal)="cancel()"
  (ok)="schedule()"
  [contentClass]="'modal-content-visible'"
>
  {{ 'memberships.revocation.user.explanation' | transloco }} {{
  'memberships.revocation.user.list.count' | transloco: { nbusers:
  userIds().length } }}
  <h2>{{ 'create-event.frequency.when' | transloco }}</h2>
  <form [formGroup]="scheduleForm">
    <h3>
      <label for="scheduleDate" class="visually-hidden"
        >{{ 'create-event.frequency.when' | transloco }}</label
      >
      <mat-form-field>
        <input
          id="scheduleDate"
          matInput
          [matDatepicker]="dp_scheduleDate"
          formControlName="scheduleDate"
          placeholder="dd/mm/yyyy, HH:mm"
        />
        <mat-datepicker-toggle
          matIconSuffix
          [for]="dp_scheduleDate"
        ></mat-datepicker-toggle>
        <mat-datepicker #dp_scheduleDate></mat-datepicker>
      </mat-form-field>
    </h3>
  </form>
</cbc-modal>
