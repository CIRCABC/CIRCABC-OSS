@let _userFeed = userFeed();
<section class="timeline-step">
  <header> {{ 'dashboard.' + when() + '.highlights' | transloco }} </header>
  <section class="summary">
    <cbc-summary-box
      [number]="_userFeed && _userFeed.uploads ? _userFeed.uploads : 0"
      [label]="'uploads'"
    ></cbc-summary-box>
    <cbc-summary-box
      [number]="_userFeed && _userFeed.updates ? _userFeed.updates : 0"
      [label]="'updates'"
    ></cbc-summary-box>
    <cbc-summary-box
      [number]="_userFeed && _userFeed.comments ? _userFeed.comments : 0"
      [label]="'comments'"
    ></cbc-summary-box>
  </section>
  @if (_userFeed) {
  <section class="groups">
    @for (groupFeed of _userFeed.groupFeeds; track groupFeed.id) {
    <cbc-group-step
      [groupFeed]="groupFeed"
      [type]="_userFeed.when"
    ></cbc-group-step>
    } @if (_userFeed.groupFeeds && _userFeed.groupFeeds.length === 0) {
    <p class="empty"> {{ 'label.nothing.to.display' | transloco }} </p>
    }
  </section>
  }
</section>
