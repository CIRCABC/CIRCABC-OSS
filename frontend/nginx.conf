server {
    listen 80;
    server_name _;
    root /opt/bitnami/nginx/html;
    index index.html;

    # --- Security Headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # HSTS — only effective when behind TLS termination (load balancer/reverse proxy)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Static assets: aggressive caching (they have content hashes in filenames) ---
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-declare security headers (nginx doesn't inherit add_header into nested blocks)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # --- SPA fallback for Angular routing ---
    location /circabc-caas/ui {
        try_files $uri $uri/ /circabc-caas/ui/index.html;
    }

    # --- Disable access to dotfiles ---
    location ~ /\. {
        deny all;
        return 404;
    }

    # --- Health check endpoint ---
    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
